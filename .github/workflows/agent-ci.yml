name: Agent CI
on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
permissions:
  contents: write
jobs:
  ci:
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test and generate output
        run: |
          set -o pipefail
          run_tests() {
            if [ -f package.json ]; then
              npm ci || npm install
            fi
            if [ -f package.json ] && [ "$(npm pkg get scripts.test)" != "null" ]; then
              npm test
            elif ls *.py >/dev/null 2>&1; then
              python -m pytest
            else
              echo "no tests"
            fi
          }
          run_tests 2>&1 | tee ci-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "EXIT=$TEST_EXIT" >> ci-output.txt
      - name: Commit ci-output.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-output.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ci-output [skip ci]"
            git push
          fi
          EXIT_CODE=$(grep '^EXIT=' ci-output.txt | tail -1 | cut -d= -f2)
          exit ${EXIT_CODE:-0}
